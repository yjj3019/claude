name: Validate FEF Harness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A single pinned version hid a 3.12-only f-string while the pack
        # advertised Python 3.11+. Test the declared floor and current releases.
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - run: python scripts/validate_repository.py
      - run: python scripts/validate_routes.py
      - run: python scripts/run_golden_tests.py --validate-only
      - run: python -m unittest discover -s tests -p "test_*.py"
      # detect_task and the install/verify path are documented entry points
      # that CI never exercised.
      - run: python scripts/detect_task.py --task "RHEL 장애 RCA를 작성해줘"
      - run: python scripts/install_pack.py --dest /tmp/fef-ci
      - run: python scripts/install_pack.py --check --dest /tmp/fef-ci
      - run: python scripts/run_golden_test_coding.py --test 012 --patch-dir tests/fixtures/GT012-code/answers
      - run: python scripts/run_golden_test_coding.py --test 013 --patch-dir tests/fixtures/GT013-code/answers
      - run: python scripts/run_golden_test_coding.py --test 014 --patch-dir tests/fixtures/GT014-code/answers
      - run: python scripts/run_golden_test_coding.py --test 026 --patch-dir tests/fixtures/GT026-code/answers
      - run: python scripts/run_golden_test_coding.py --test 027 --patch-dir tests/fixtures/GT027-code/answers
      - run: python scripts/run_golden_test_coding.py --test 028 --patch-dir tests/fixtures/GT028-code/answers
      - run: python scripts/run_golden_test_coding.py --test 029 --patch-dir tests/fixtures/GT029-code/answers
      - run: python scripts/run_golden_test_coding.py --test 030 --patch-dir tests/fixtures/GT030-code/answers
      - run: python scripts/run_golden_test_coding.py --test 031 --patch-dir tests/fixtures/GT031-code/answers
      - run: "! python scripts/run_golden_test_coding.py --test 012 --patch-from tests/fixtures/GT012-code/money.py"
