name: Validate Delegation Loop

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate package
        run: python scripts/delegation/validate_skill.py
      - name: Script tests
        run: python -m unittest discover -s scripts/delegation -p "test_*.py"
      - name: Check current deterministic acceptance evidence without model execution
        run: python scripts/delegation/refresh_evidence.py --check
      - name: Restore archived Git history
        run: python scripts/delegation/verify_history.py
      - name: Refuse uncleared ZIP distribution without writing an artifact
        shell: python
        run: |
          import pathlib, subprocess, sys
          output = pathlib.Path("dist/ai-delegation-loop.zip")
          assert not output.exists()
          result = subprocess.run([sys.executable, "scripts/delegation/install.py", "package", "--output", str(output)], capture_output=True, text=True)
          assert result.returncode != 0, result.stdout
          assert "unresolved redistribution permission" in (result.stdout + result.stderr).lower()
          assert not output.exists()

  compare-zips:
    if: always()
    needs: validate
    runs-on: ubuntu-latest
    # Keep the historical job ID for existing check references; no ZIP is shipped.
    steps:
      - name: Confirm redistribution was refused on every matrix target
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATE_RESULT" = success
