name: Validate Delegation Loop

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate package
        run: python scripts/delegation/validate_skill.py
      - name: Script tests
        run: python -m unittest discover -s scripts/delegation -p "test_*.py"
      - name: Check current deterministic acceptance evidence without model execution
        run: python scripts/delegation/refresh_evidence.py --check
      - name: Restore archived Git history
        run: python scripts/delegation/verify_history.py
      - name: Build deterministic ZIP
        run: python scripts/delegation/install.py package --output ./dist/ai-delegation-loop.zip
      - name: ZIP SHA-256
        run: python -c "import hashlib, pathlib; value = hashlib.sha256(pathlib.Path('dist/ai-delegation-loop.zip').read_bytes()).hexdigest(); pathlib.Path('dist/package.sha256').write_text(value, encoding='ascii'); print('ZIP_SHA256=' + value)"
      - uses: actions/upload-artifact@v4
        with:
          name: delegation-zip-${{ matrix.os }}-${{ matrix.python }}
          path: dist/package.sha256
          retention-days: 1

  compare-zips:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: delegation-zip-*
          path: zip-hashes
      - name: Require identical ZIPs across platforms and Python versions
        run: python -c "import pathlib; values = [p.read_text(encoding='ascii') for p in pathlib.Path('zip-hashes').rglob('package.sha256')]; assert len(values) == 4 and len(set(values)) == 1, values; print('ZIP_SHA256=' + values[0])"
